name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ALPINE_VERSION: "3.21.3"

jobs:
  macos-build-test:
    runs-on: macos-latest
    needs: guest-build
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          (sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer) || \
          (sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer) || true
      - name: swift test
        run: |
          cd macos
          swift test 2>&1 | tee test.log
      - name: Download guest assets from guest-build job
        uses: actions/download-artifact@v4
        with:
          name: guest-assets
          path: macos/guest/
      - name: swift build (CLI)
        run: |
          cd macos
          set -o pipefail
          swift build 2>&1 | tail -5
      - name: Generate CI signing key and policy anchor
        run: |
          cd macos
          ./.build/debug/dbx-poc gen-guest-sign-key --output-key ./guest/ci-sign-key.local >/dev/null
          DEV_PRIV=$(sed 's/private://' ./guest/ci-sign-key.local | tr -d '[:space:]')
          DEV_PUB=$(swift -e 'import CryptoKit; import Foundation; let hex = CommandLine.arguments[1]; var data = Data(); var i = hex.startIndex; while i < hex.endIndex { data.append(UInt8(hex[i..<hex.index(i, offsetBy: 2)], radix: 16)!); i = hex.index(i, offsetBy: 2) }; let k = try Curve25519.Signing.PrivateKey(rawRepresentation: data); print(k.publicKey.rawRepresentation.map { String(format: "%02x", $0) }.joined())' "$DEV_PRIV")
          cat > Sources/DeskBoxVZ/DevSigningPublicKey.generated.swift <<EOGEN
          // GENERATED by CI — do not commit.
          enum DevSigningPublicKey { static let value: String? = "${DEV_PUB}" }
          EOGEN
      - name: Build validated bundle
        run: |
          cd macos
          set -o pipefail
          swift build 2>&1 | tail -5
          SBOM_SHA=$(shasum -a 256 ./guest/sbom.json | awk '{print $1}')
          ./.build/debug/dbx-poc make-manifest \
            --kernel ./guest/vmlinuz-virt \
            --initrd ./guest/initrd-deskbox.img \
            --root-disk ./guest/root-disk.raw \
            --asset-version 1 \
            --sbom-digest "$SBOM_SHA" \
            --output ./guest/manifest.unsigned.json
          ./.build/debug/dbx-poc sign-manifest \
            --manifest ./guest/manifest.unsigned.json \
            --key ./guest/ci-sign-key.local \
            --output ./guest/manifest.json
      - name: validate-assets signed (expect OK)
        run: |
          cd macos
          ./.build/debug/dbx-poc validate-assets ./guest/manifest.json
      - name: validate-assets unsigned (expect FAIL)
        run: |
          cd macos
          if ./.build/debug/dbx-poc validate-assets ./guest/manifest.unsigned.json; then
            echo "EXPECTED-FAIL regression: unsigned manifest was accepted"
            exit 1
          fi
      - name: verify-sbom (expect OK)
        run: |
          cd macos
          ./.build/debug/dbx-poc verify-sbom ./guest/sbom.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-evidence
          path: |
            macos/test.log
            macos/guest/manifest.json
          if-no-files-found: ignore

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Run guest C fuzz harness
        run: |
          cd macos
          ./scripts/run-fuzz.sh /tmp/dbx-fuzz-harness 2>&1 | tee /tmp/fuzz.log
      - name: Upload fuzz log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-log
          path: /tmp/fuzz.log
          if-no-files-found: ignore

  repro-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl docker.io
      - name: Setup QEMU for arm64 emulation
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64
      - name: Idempotent rebuild pass 1 (assets)
        run: |
          cd macos
          rm -rf /tmp/r1 && mkdir -p /tmp/r1
          SKIP_SWIFT_SIGN=1 ALPINE_VERSION=$ALPINE_VERSION ./scripts/build-alpine-guest.sh /tmp/r1
      - name: Idempotent rebuild pass 2 (assets) + compare
        run: |
          cd macos
          rm -rf /tmp/r2 && mkdir -p /tmp/r2
          SKIP_SWIFT_SIGN=1 ALPINE_VERSION=$ALPINE_VERSION ./scripts/build-alpine-guest.sh /tmp/r2
          sha1=$(shasum -a 256 /tmp/r1/vmlinuz-virt /tmp/r1/initrd-deskbox.img /tmp/r1/root-disk.raw /tmp/r1/sbom.json | awk '{print $1}')
          sha2=$(shasum -a 256 /tmp/r2/vmlinuz-virt /tmp/r2/initrd-deskbox.img /tmp/r2/root-disk.raw /tmp/r2/sbom.json | awk '{print $1}')
          [ "$sha1" = "$sha2" ]
      - name: Upload repro pass 1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repro-assets-1
          path: |
            /tmp/r1/vmlinuz-virt
            /tmp/r1/initrd-deskbox.img
            /tmp/r1/root-disk.raw
            /tmp/r1/sbom.json
          if-no-files-found: error
      - name: Upload repro pass 2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repro-assets-2
          path: |
            /tmp/r2/vmlinuz-virt
            /tmp/r2/initrd-deskbox.img
            /tmp/r2/root-disk.raw
            /tmp/r2/sbom.json
          if-no-files-found: error

  idempotent-release:
    runs-on: macos-latest
    needs: repro-check
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          (sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer) || \
          (sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer) || true
      - name: swift build
        run: |
          cd macos
          set -o pipefail
          swift build 2>&1 | tail -5
      - name: Generate idempotent test key + policy anchor
        run: |
          cd macos
          ./.build/debug/dbx-poc gen-guest-sign-key --output-key /tmp/idem-sign-key.local >/dev/null
          DEV_PRIV=$(sed 's/private://' /tmp/idem-sign-key.local | tr -d '[:space:]')
          DEV_PUB=$(swift -e 'import CryptoKit; import Foundation; let hex = CommandLine.arguments[1]; var data = Data(); var i = hex.startIndex; while i < hex.endIndex { data.append(UInt8(hex[i..<hex.index(i, offsetBy: 2)], radix: 16)!); i = hex.index(i, offsetBy: 2) }; let k = try Curve25519.Signing.PrivateKey(rawRepresentation: data); print(k.publicKey.rawRepresentation.map { String(format: "%02x", $0) }.joined())' "$DEV_PRIV")
          SRC="${SOURCE_DATE_EPOCH:-$(git log -1 --format=%ct)}"
          echo "SOURCE_DATE_EPOCH=$SRC" >> $GITHUB_ENV
          cat > Sources/DeskBoxVZ/DevSigningPublicKey.generated.swift <<EOGEN
          // GENERATED by CI idempotent-release job — do not commit.
          enum DevSigningPublicKey { static let value: String? = "${DEV_PUB}" }
          EOGEN
          swift build 2>&1 | tail -3
          echo "Release keys manifest stub"
          KEY_ID=${DEV_PUB:0:16}
          NOW=$(date -u -r "$SRC" +%Y-%m-%dT%H:%M:%SZ)
          printf '{"schema":"deskbox-release-keys/v1","generatedAtUtc":"%s","keys":[{"keyID":"%s","publicHex":"%s","status":"active","notBefore":"%s","notAfter":null,"note":"ci idempotent"}]}\n' "$NOW" "$KEY_ID" "$DEV_PUB" "$NOW" > /tmp/idem-release-keys.json
      - name: Download repro pass 1 artifacts
        uses: actions/download-artifact@v4
        with:
          name: repro-assets-1
          path: /tmp/r1
      - name: Download repro pass 2 artifacts
        uses: actions/download-artifact@v4
        with:
          name: repro-assets-2
          path: /tmp/r2
      - name: Idempotent publish pass 1
        run: |
          cd macos
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          SBOM_SHA=$(shasum -a 256 /tmp/r1/sbom.json | awk '{print $1}')
          mkdir -p /tmp/idem1
          ./.build/debug/dbx-poc make-manifest \
            --kernel /tmp/r1/vmlinuz-virt \
            --initrd /tmp/r1/initrd-deskbox.img \
            --root-disk /tmp/r1/root-disk.raw \
            --asset-version 1 \
            --sbom-digest "$SBOM_SHA" \
            --output /tmp/idem1/manifest.unsigned.json
          ./.build/debug/dbx-poc sign-manifest \
            --manifest /tmp/idem1/manifest.unsigned.json \
            --key /tmp/idem-sign-key.local \
            --output /tmp/idem1/manifest.json
          mkdir -p /tmp/idem-channel-1
          cp /tmp/idem1/manifest.json /tmp/idem-channel-1/
          cp /tmp/r1/sbom.json /tmp/idem-channel-1/
          ./.build/debug/dbx-poc publish \
            --channel /tmp/idem-channel-1 \
            --manifest /tmp/idem1/manifest.json \
            --sbom /tmp/r1/sbom.json \
            --release-keys /tmp/idem-release-keys.json \
            --release-tag idempotent-test \
            --min-version-floor 1
      - name: Idempotent publish pass 2 + strict byte equality
        run: |
          cd macos
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          SBOM_SHA=$(shasum -a 256 /tmp/r2/sbom.json | awk '{print $1}')
          mkdir -p /tmp/idem2
          ./.build/debug/dbx-poc make-manifest \
            --kernel /tmp/r2/vmlinuz-virt \
            --initrd /tmp/r2/initrd-deskbox.img \
            --root-disk /tmp/r2/root-disk.raw \
            --asset-version 1 \
            --sbom-digest "$SBOM_SHA" \
            --output /tmp/idem2/manifest.unsigned.json
          ./.build/debug/dbx-poc sign-manifest \
            --manifest /tmp/idem2/manifest.unsigned.json \
            --key /tmp/idem-sign-key.local \
            --output /tmp/idem2/manifest.json
          mkdir -p /tmp/idem-channel-2
          cp /tmp/idem2/manifest.json /tmp/idem-channel-2/
          cp /tmp/r2/sbom.json /tmp/idem-channel-2/
          ./.build/debug/dbx-poc publish \
            --channel /tmp/idem-channel-2 \
            --manifest /tmp/idem2/manifest.json \
            --sbom /tmp/r2/sbom.json \
            --release-keys /tmp/idem-release-keys.json \
            --release-tag idempotent-test \
            --min-version-floor 1
          for f in manifest.json sbom.json channel.json; do
            cmp "/tmp/idem-channel-1/$f" "/tmp/idem-channel-2/$f"
          done
          echo "IDEMPOTENT-RELEASE OK"
  guest-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl docker.io
      - name: Setup QEMU for arm64 emulation
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64
      - name: Build guest assets (SBOM only; signing happens on macOS side)
        run: |
          cd macos
          chmod +x ./scripts/build-alpine-guest.sh
          SKIP_SWIFT_SIGN=1 ALPINE_VERSION=$ALPINE_VERSION ./scripts/build-alpine-guest.sh ./guest
      - name: Upload guest assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-assets
          path: |
            macos/guest/vmlinuz-virt
            macos/guest/initrd-deskbox.img
            macos/guest/root-disk.raw
            macos/guest/debian-initrd.gz
            macos/guest/guest-bootstrap.c
            macos/guest/brokerreq.c
            macos/guest/sbom.json
          if-no-files-found: error
