name: Release

on:
  # 手动触发：用于「明确要一份未公证的 dev DMG」的场景（缺 Developer ID 时的唯一出口）。
  # 默认 false，tag 推送路径永远是 fail-closed 的正式语义。
  workflow_dispatch:
    inputs:
      allow_unsigned_dev_dmg:
        description: "构建并发布未公证的 dev DMG（无 Developer ID 时使用）"
        type: boolean
        default: false
      release_tag:
        description: "复用的既有 tag（例如 v0.2.0）"
        required: true
  push:
    tags:
      - "v*-alpha*"
      # GitHub Actions 的 tag filter 是 glob，不是正则：用 `v*.*.*` 覆盖正式语义化版本。
      - "v*.*.*"

env:
  ALPINE_VERSION: "3.21.3"

jobs:
  guest-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl docker.io
      - name: Setup QEMU for arm64 emulation
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64
      - name: Build guest assets
        run: |
          cd macos
          SKIP_SWIFT_SIGN=1 ALPINE_VERSION=$ALPINE_VERSION ./scripts/build-alpine-guest.sh ./guest
      - name: Upload guest assets
        uses: actions/upload-artifact@v4
        with:
          name: guest-assets
          path: |
            macos/guest/vmlinuz-virt
            macos/guest/initrd-deskbox.img
            macos/guest/root-disk.raw
            macos/guest/debian-initrd.gz
            macos/guest/guest-bootstrap.c
            macos/guest/brokerreq.c
            macos/scripts/build-alpine-guest.sh
            macos/guest/sbom.json
          if-no-files-found: error

  publish:
    runs-on: macos-latest
    needs: guest-build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          (sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer) || \
          (sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer) || true
      - name: Download guest assets
        uses: actions/download-artifact@v4
        with:
          name: guest-assets
          path: macos/
      - name: Generate CI signing key
        run: |
          cd macos
          swift build 2>&1 | tail -3
          ./.build/debug/dbx-poc gen-guest-sign-key --output-key ./guest/ci-sign-key.local >/dev/null
          DEV_PRIV=$(sed 's/private://' ./guest/ci-sign-key.local | tr -d '[:space:]')
          DEV_PUB=$(swift -e 'import CryptoKit; import Foundation; let hex = CommandLine.arguments[1]; var data = Data(); var i = hex.startIndex; while i < hex.endIndex { data.append(UInt8(hex[i..<hex.index(i, offsetBy: 2)], radix: 16)!); i = hex.index(i, offsetBy: 2) }; let k = try Curve25519.Signing.PrivateKey(rawRepresentation: data); print(k.publicKey.rawRepresentation.map { String(format: "%02x", $0) }.joined())' "$DEV_PRIV")
          cat > Sources/DeskBoxVZ/DevSigningPublicKey.generated.swift <<EOGEN
          // GENERATED by CI — do not commit.
          enum DevSigningPublicKey { static let value: String? = "${DEV_PUB}" }
          EOGEN
      - name: Normalize sbom for released-bundle verification
        run: |
          cd macos
          cp ./scripts/build-alpine-guest.sh ./guest/build-alpine-guest.sh
          python3 -c 'import json; p="./guest/sbom.json"; doc=json.load(open(p)); [(e.__setitem__("file","build-alpine-guest.sh")) for e in doc.get("inputs",[]) if e.get("path")=="scripts/build-alpine-guest.sh" and "file" not in e]; json.dump(doc, open(p,"w"), indent=2)'
      - name: Sign manifest & validate
        run: |
          cd macos
          swift build 2>&1 | tail -3
          SBOM_SHA=$(shasum -a 256 ./guest/sbom.json | awk '{print $1}')
          ./.build/debug/dbx-poc make-manifest \
            --kernel ./guest/vmlinuz-virt \
            --initrd ./guest/initrd-deskbox.img \
            --root-disk ./guest/root-disk.raw \
            --asset-version 1 \
            --sbom-digest "$SBOM_SHA" \
            --output ./guest/manifest.unsigned.json
          ./.build/debug/dbx-poc sign-manifest \
            --manifest ./guest/manifest.unsigned.json \
            --key ./guest/ci-sign-key.local \
            --output ./guest/manifest.json
          ./.build/debug/dbx-poc validate-assets ./guest/manifest.json
          if ./.build/debug/dbx-poc validate-assets ./guest/manifest.unsigned.json; then
            echo "EXPECTED-FAIL regression: unsigned manifest was accepted"
            exit 1
          fi
          ./.build/debug/dbx-poc verify-sbom ./guest/sbom.json
      - name: Create release channel directory
        run: |
          cd macos
          rm -rf /tmp/dbx-channel
          mkdir -p /tmp/dbx-channel
          cp ./guest/manifest.json /tmp/dbx-channel/manifest.json
          cp ./guest/sbom.json /tmp/dbx-channel/sbom.json
          # release-keys.json 若不存在，则基于 CI key 重建。
          if [ ! -f ./guest/release-keys.json ]; then
            DEV_PUB=$(swift -e 'import CryptoKit; import Foundation; let hex = CommandLine.arguments[1]; var data = Data(); var i = hex.startIndex; while i < hex.endIndex { data.append(UInt8(hex[i..<hex.index(i, offsetBy: 2)], radix: 16)!); i = hex.index(i, offsetBy: 2) }; let k = try Curve25519.Signing.PrivateKey(rawRepresentation: data); print(k.publicKey.rawRepresentation.map { String(format: "%02x", $0) }.joined())' "$(sed 's/private://' ./guest/ci-sign-key.local | tr -d '[:space:]')")
            KEY_ID="${DEV_PUB:0:16}"
            NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            printf '{"schema":"deskbox-release-keys/v1","generatedAtUtc":"%s","keys":[{"keyID":"%s","publicHex":"%s","status":"active","notBefore":"%s","notAfter":null,"note":"ci release key"}]}\n' "$NOW" "$KEY_ID" "$DEV_PUB" "$NOW" > ./guest/release-keys.json
          fi
          ./.build/debug/dbx-poc publish \
            --channel /tmp/dbx-channel \
            --manifest ./guest/manifest.json \
            --sbom ./guest/sbom.json \
            --release-keys ./guest/release-keys.json \
            --release-tag ${{ github.ref_name }} \
            --min-version-floor 1
      - name: Verify channel manifest
        run: |
          cd macos
          ./.build/debug/dbx-poc verify-channel /tmp/dbx-channel/channel.json
      - name: Create bundle + checksums
        run: |
          cd macos
          rm -rf /tmp/dbx-bundle
          mkdir -p /tmp/dbx-bundle
          cp /tmp/dbx-channel/manifest.json /tmp/dbx-channel/sbom.json /tmp/dbx-channel/channel.json \
             ./guest/release-keys.json /tmp/dbx-bundle/ 2>/dev/null || true
          cp ./guest/vmlinuz-virt ./guest/initrd-deskbox.img ./guest/root-disk.raw \
             ./guest/debian-initrd.gz ./guest/guest-bootstrap.c ./guest/brokerreq.c /tmp/dbx-bundle/
          cp ./scripts/build-alpine-guest.sh /tmp/dbx-bundle/
          TAG="${{ github.ref_name }}"
          tar -czf "/tmp/dbx-channel/guest-bundle-${TAG}.tar.gz" -C /tmp/dbx-bundle .
          (cd /tmp/dbx-channel && shasum -a 256 manifest.json sbom.json channel.json "guest-bundle-${TAG}.tar.gz" > checksums.txt)
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/dbx-channel/manifest.json
            /tmp/dbx-channel/sbom.json
            /tmp/dbx-channel/channel.json
            /tmp/dbx-channel/checksums.txt
            /tmp/dbx-channel/guest-bundle-${{ github.ref_name }}.tar.gz
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true

  # M22：可分发 app + DMG + 公证（docs/design/m22-distribution-notarization.md）
  app:
    runs-on: macos-latest
    needs: publish
    permissions:
      contents: write
    env:
      # 正式 tag 必须公证：缺 secrets 直接失败，不产出「看起来像正式版」的 dev 包。
      REQUIRE_NOTARIZATION: ${{ (contains(github.ref_name, 'alpha') || inputs.allow_unsigned_dev_dmg) && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          (sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer) || \
          (sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer) || true
          xcodebuild -version

      - name: Download guest assets
        uses: actions/download-artifact@v4
        with:
          name: guest-assets
          path: macos/

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: env.REQUIRE_NOTARIZATION == '1' || github.event_name == 'push'
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::warning::未配置 MACOS_DEVELOPER_ID_P12_BASE64；正式 tag 将在打包阶段 fail-closed"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/dbx-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Store notarytool credentials
        if: env.REQUIRE_NOTARIZATION == '1'
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "::error::正式 tag 需要公证凭据（MACOS_NOTARY_APPLE_ID / MACOS_NOTARY_TEAM_ID / MACOS_NOTARY_APP_PASSWORD）"
            exit 1
          fi
          xcrun notarytool store-credentials "dbx-ci" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

      - name: Package app + DMG
        run: |
          cd macos
          VERSION="${{ steps.ver.outputs.version }}" \
          BUILD="${{ steps.ver.outputs.build }}" \
            ./scripts/package-app.sh 2>&1 | tee /tmp/package.log
          DMG=$(ls gui/dist/DeskBox-*.dmg | head -1)
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize + staple
        if: env.REQUIRE_NOTARIZATION == '1'
        run: |
          cd macos
          NOTARY_PROFILE=dbx-ci ./scripts/notarize.sh "$DMG"
          NOTARY_PROFILE=dbx-ci ./scripts/notarize.sh gui/dist/DeskBox.app

      - name: Verify distribution (e2e)
        run: |
          cd macos
          VERSION="${{ steps.ver.outputs.version }}" ./scripts/e2e-distribution.sh

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos/gui/dist/DeskBox-*.dmg
            macos/gui/dist/SHA256SUMS
          tag_name: ${{ github.ref_name }}
